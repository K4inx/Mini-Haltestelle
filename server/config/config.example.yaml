# Wird vom Web-UI verwaltet (Vorlagen, Zeitplan, Nachtmodus).
# Fehlt die Datei, legt der Server beim Start eine leere an. Kommentare gehen beim
# Speichern aus dem Web-UI verloren — Aufbau siehe README, Abschnitt Konfiguration.

provider: auto            # auto = rmv, sobald RMV_API_KEY gesetzt ist, sonst transitous
timezone: Europe/Berlin
profiles: {}              # Vorlagen, im Web-UI anlegen
schedule: []
night:
  days: [mon, tue, wed, thu, fri, sat, sun]
  from: "23:00"
  to: "06:00"
  mode: dim               # dim | off
  brightness: 0.05
brightness: 0.8
poll:
  interval_seconds: 30    # Minimum 30 (Transitous-Richtlinie)
  departures_per_station: 30
  rmv_daily_budget: 4500  # RMV erlaubt 5000/Tag
  timeout_seconds: 10
